[project]
name = "rising-tracker"
version = "0.1.0"
description = "Early-signal tracker for newly created GitHub repositories, with a grounded LLM digest"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "typer>=0.29.1",
    "fastapi>=0.162.6",
    "uvicorn>=0.54.0",
    "openai>=3.50.0",
    "sqlalchemy>=2.1.8",
]

[project.scripts]
rising = "rising.interfaces.cli:main"

[dependency-groups]
dev = ["pytest>=9.2.0", "ruff>=0.17.5"]

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.build-backend]
module-name = "rising"
